name: Daily smoke test of published Actors
on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Run smoke checks (a failure makes GitHub e-mail the repository owner)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_USERNAME: ${{ vars.APIFY_USERNAME }}
        run: node monitoring/smoke.mjs
